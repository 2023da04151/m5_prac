model_building:
  data_dir: data/processed
  model_dir: models
  store: CA_1
  cv: cv4
  first_day: 710
  max_items: null
  num_threads: 0
  num_boost_round: 1500
  early_stopping: 50
  force: false
  lgb_params:
    boosting_type: gbdt
    objective: tweedie
    tweedie_variance_power: 1.1
    metric: rmse
    learning_rate: 0.05
    num_leaves: 255
    min_data_in_leaf: 255
    subsample: 0.5
    subsample_freq: 1
    feature_fraction: 0.5
    max_bin: 100
    boost_from_average: false
    verbose: -1
    seed: 1995

model_evaluation:
  predictions_path: models/non_recur_CA_1_cv4_predictions.csv
  model_path: models/model.pkl
  experiment_info_path: experiment_info.json
  experiment_name: m5_forecasting_dvcpipeline
  run_name: lgb_CA_1_cv4_evaluation
