
name: CI

on:
  push:
  pull_request:


jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff mypy "pandas-stubs>=2.3.0" "types-PyYAML>=6.0.12"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy .
